name: Sync with Upstream & Auto Commit

on:
  schedule:
    # Poll aiskendi every 5 minutes (GitHub's minimum cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Trigger Render deploy hook even if already in sync'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync fork with aiskendi/pencarimovie-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      # Use GitHub's compare API — "behind_by > 0" means aiskendi has new commits
      # our fork is missing. Using branch name "main" (not "HEAD") in the URL.
      - name: Check if upstream is ahead via GitHub API
        id: api_check
        run: |
          COMPARE=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/arib0199/pencurimovie-server/compare/main...aiskendi:pencarimovie-server:main")

          if [ -z "$COMPARE" ]; then
            echo "ERROR: GitHub API returned empty response. Aborting." >&2
            exit 1
          fi

          BEHIND=$(echo "$COMPARE" | jq -r '.behind_by // 0')
          STATUS=$(echo "$COMPARE" | jq -r '.status // "unknown"')

          echo "behind_by=$BEHIND" >> $GITHUB_OUTPUT
          echo "compare_status=$STATUS" >> $GITHUB_OUTPUT
          echo "API compare status: $STATUS, behind_by: $BEHIND"

          if [ "$BEHIND" -gt 0 ]; then
            echo "needs_sync=true" >> $GITHUB_OUTPUT
            echo "Fork is $BEHIND commit(s) behind aiskendi. Syncing..."
          else
            echo "needs_sync=false" >> $GITHUB_OUTPUT
            echo "Fork is up-to-date with aiskendi. No action needed."
          fi

      - name: Checkout fork
        if: steps.api_check.outputs.needs_sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        if: steps.api_check.outputs.needs_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote & fetch
        if: steps.api_check.outputs.needs_sync == 'true'
        run: |
          git remote add upstream https://github.com/aiskendi/pencarimovie-server.git
          git fetch upstream main --tags --force

      - name: Merge upstream changes into fork
        if: steps.api_check.outputs.needs_sync == 'true'
        env:
          BEHIND: ${{ steps.api_check.outputs.behind_by }}
        run: |
          git checkout main
          git merge upstream/main \
            --no-edit \
            --strategy-option=theirs
          echo "Merge complete. Pushing to origin..."
          git push origin main
          git push origin --tags --force
          echo "✅ Synced $BEHIND new commit(s) from aiskendi!"

      - name: Trigger Render Deploy Hook (if configured)
        if: >
          steps.api_check.outputs.needs_sync == 'true' ||
          github.event.inputs.force_deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered successfully!"
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set — skipping deploy."
          fi


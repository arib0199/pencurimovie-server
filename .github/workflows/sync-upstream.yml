name: Sync with Upstream & Auto Commit

on:
  schedule:
    # Poll aiskendi every 5 minutes (GitHub's minimum cron interval)
    # This is as close to "real-time" as GitHub Actions allows for watching
    # another repo — triggers a sync within 5 min of any new aiskendi commit.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Trigger Render deploy hook even if already in sync'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync fork with aiskendi/pencarimovie-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      # Step 1: Fast pre-check using GitHub API — no git checkout needed.
      # If upstream SHA matches our fork's SHA, skip everything else.
      - name: Quick check via GitHub API
        id: api_check
        run: |
          UPSTREAM_SHA=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/aiskendi/pencarimovie-server/commits/main" \
            | jq -r '.sha')

          FORK_SHA=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/arib0199/pencurimovie-server/commits/main" \
            | jq -r '.sha')

          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "fork_sha=$FORK_SHA" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_SHA" = "$FORK_SHA" ]; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "Already in sync (SHA: $FORK_SHA). No action needed."
          else
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "New commit detected on aiskendi! upstream=$UPSTREAM_SHA fork=$FORK_SHA"
          fi

      - name: Checkout fork
        if: steps.api_check.outputs.already_synced == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        if: steps.api_check.outputs.already_synced == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote & fetch
        if: steps.api_check.outputs.already_synced == 'false'
        run: |
          git remote add upstream https://github.com/aiskendi/pencarimovie-server.git
          git fetch upstream main --tags --force

      - name: Merge upstream changes into fork
        if: steps.api_check.outputs.already_synced == 'false'
        run: |
          git checkout main
          git merge upstream/main \
            --no-edit \
            --strategy-option=theirs
          echo "Merge complete. Pushing to origin..."
          git push origin main
          git push origin --tags --force
          echo "✅ Successfully synced and committed new changes from aiskendi!"

      - name: Trigger Render Deploy Hook (if configured)
        if: >
          steps.api_check.outputs.already_synced == 'false' ||
          github.event.inputs.force_deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered successfully!"
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set — skipping deploy."
          fi


name: Sync with Upstream & Auto Commit

on:
  schedule:
    # Check for new commits from aiskendi every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Trigger Render deploy hook even if already in sync'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync fork with aiskendi/pencarimovie-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/aiskendi/pencarimovie-server.git

      - name: Fetch upstream commits and tags
        run: |
          git fetch upstream main --tags --force

      - name: Check if aiskendi has new commits
        id: check
        run: |
          UPSTREAM=$(git rev-parse upstream/main)
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "in_sync=true" >> $GITHUB_OUTPUT
            echo "Already up-to-date with aiskendi. No new commits."
          else
            echo "in_sync=false" >> $GITHUB_OUTPUT
            echo "New commits detected from aiskendi! Syncing..."
          fi

      - name: Merge upstream changes into fork
        if: steps.check.outputs.in_sync == 'false'
        run: |
          git checkout main

          # Merge upstream using ours strategy for any conflicts in fork-only files
          git merge upstream/main \
            --no-edit \
            --strategy-option=theirs \
            -m "chore: sync with upstream aiskendi/pencarimovie-server"

          echo "Merge complete. Pushing to origin..."
          git push origin main
          git push origin --tags --force
          echo "Successfully committed and pushed new changes from aiskendi!"

      - name: Trigger Render Deploy Hook (if configured)
        if: >
          steps.check.outputs.in_sync == 'false' ||
          github.event.inputs.force_deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deploy hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Render deployment triggered successfully!"
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set, skipping deploy."
          fi


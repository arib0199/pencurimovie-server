name: Sync with Upstream & Auto Commit

on:
  schedule:
    # Check for new commits from aiskendi every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Trigger Render deploy hook even if already in sync'
        type: boolean
        default: false

jobs:
  sync:
    name: Sync fork with aiskendi/pencarimovie-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/aiskendi/pencarimovie-server.git
          git remote -v

      - name: Fetch upstream commits and tags
        run: git fetch upstream main --tags

      - name: Check if aiskendi has new commits
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          echo "upstream=$UPSTREAM" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "in_sync=true" >> $GITHUB_OUTPUT
            echo "Already up-to-date with aiskendi/pencarimovie-server. No new commits to pull."
          else
            echo "in_sync=false" >> $GITHUB_OUTPUT
            echo "aiskendi has new commits! Syncing and committing..."
          fi

      - name: Merge and commit upstream changes
        if: steps.check.outputs.in_sync == 'false'
        run: |
          git checkout main
          git merge upstream/main --no-edit -m "chore: sync with upstream aiskendi/pencarimovie-server"
          git push origin main
          git push origin --tags
          echo "Successfully synced and committed new changes from aiskendi!"

      - name: Trigger Render Deploy Hook (if configured)
        if: (steps.check.outputs.in_sync == 'false' || inputs.force_deploy == true) && env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deploy hook..."
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Render deployment triggered successfully!"
